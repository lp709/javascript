<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>019</title>

    <style>
        .main {

            width: 200px;
            height: 100px;
            margin: 300px auto 0px auto;

        }

        .result {

            color: red;
            font-size: 20px;
            text-align: center;

        }

        #input {

            width: 150%;
            height: 25%;

        }
    </style>

</head>

<body>

    <main class="main">

        <input type="text" name="input" id="input" value="try yourself" />
        <p class="result"></p>

    </main>

    <script>

        const input = document.querySelector('#input');
        const result = document.querySelector('.result');

        input.addEventListener('input', () => {

            const up = input.value.toUpperCase();
            result.innerHTML = up;

        })

    </script>

</body>

</html>
